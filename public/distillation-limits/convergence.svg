  <text class="lbl" x="320" y="216" font-size="13.5" text-anchor="middle">더 안 줄어든다</text>
  <text class="mut" x="230" y="307" font-size="13" text-anchor="middle">전체 loss가 납작해졌다 → &quot;수렴했다, 학습 끝&quot;</text>
  <text class="warn" x="230" y="328" font-size="13" text-anchor="middle">그런데 이 곡선은 평균이라, 꼬리의 실패를 못 본다</text>

