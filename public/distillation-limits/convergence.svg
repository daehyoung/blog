  <circle cx="577" cy="244" r="9" fill="#2563eb"/>
  <circle cx="762" cy="127" r="9" fill="#dc2626"/>
  <text class="lbl accent" x="577" y="189" font-size="13.5" text-anchor="middle">중앙</text>
  <text class="mut"        x="577" y="207" font-size="12" text-anchor="middle">바닥에 도착</text>
  <text class="mut"        x="577" y="224" font-size="12" text-anchor="middle">= 정답</text>
  <text class="lbl warn" x="762" y="110" font-size="13.5" text-anchor="middle">꼬리</text>
  <text class="mut"      x="762" y="164" font-size="12" text-anchor="middle">평지에 방치</text>
  <text class="mut"      x="762" y="181" font-size="12" text-anchor="middle">= 틀린 채로 멈춤</text>
  <text class="mut" x="660" y="307" font-size="13" text-anchor="middle">둘 다 기울기 ≈ 0 이라 안 움직인다 — 증상이 같다</text>
  <text class="warn" x="660" y="328" font-size="13" text-anchor="middle">하나는 도착이고 하나는 방치다</text>

  <text class="lbl" x="440.0" y="388" font-size="14.5" text-anchor="middle">꼬리가 멈춘 건 <tspan class="accent">다 배워서</tspan>가 아니라 <tspan class="warn">미는 힘이 없어서</tspan>다</text>
  <text class="mut" x="440.0" y="412" font-size="13" text-anchor="middle">빠져나오기 어려운 웅덩이(로컬 미니멈)가 아니라, 애초에 경사가 없는 평지다 — 그래서 힘을 실어주면 다시 움직인다</text>
</svg>
