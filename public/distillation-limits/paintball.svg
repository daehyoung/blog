  <text class="lbl accent" x="378" y="199" font-size="13.5" text-anchor="middle">자국이</text>
  <text class="lbl accent" x="378" y="216" font-size="13.5" text-anchor="middle">남은 면</text>
  <text class="mut" x="478" y="193" font-size="14" text-anchor="middle">?</text>
  <text class="mut" x="478" y="215" font-size="12" text-anchor="middle">0발</text>
  <text class="mut" x="430" y="335" font-size="12.5" text-anchor="middle">물체 — 얼마나 큰지 모른다</text>

  <path class="dash" d="M 545 150 L 610 126"/>
  <text class="warn" x="690" y="120" font-size="15" text-anchor="middle">안 쏜 방향</text>
  <text class="mut"  x="690" y="141" font-size="12.5" text-anchor="middle">뭐가 있는지는커녕</text>
  <text class="mut"  x="690" y="159" font-size="12.5" text-anchor="middle">있는지조차 모른다</text>

  <text class="lbl"  x="690" y="205" font-size="14.5" text-anchor="middle">500발 쐈다 — 그런데</text>
  <text class="warn" x="690" y="228" font-size="15" text-anchor="middle">전체의 몇 %인가?</text>
  <text class="mut"  x="690" y="250" font-size="12.5" text-anchor="middle">분모(물체 크기)를 모르니</text>
  <text class="mut"  x="690" y="268" font-size="12.5" text-anchor="middle">완성도가 계산되지 않는다</text>

  <text class="lbl" x="430.0" y="368" font-size="14.5" text-anchor="middle">자국을 이어 형상을 <tspan class="accent">유추</tspan>한다 — 쏜 자리만 알고, 나머지는 지어낸다</text>
  <text class="mut" x="430.0" y="392" font-size="13" text-anchor="middle">그래서 분모를 &apos;물체 전체&apos;가 아니라 &apos;실제로 만지는 부위&apos;로 바꾼다 — 그게 도메인 좁히기다</text>
</svg>
