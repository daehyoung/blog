<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" role="img"
     aria-label="어둠 속 물체에 페인트볼을 쏴서 맞은 자국으로 형상을 유추하는 그림. 안 쏜 뒷면에는 자국이 없다">
  <style>
    :root { color-scheme: light dark; }
    .curve  { fill: none; stroke: #2563eb; stroke-width: 2.2; }
