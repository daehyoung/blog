  <style>
    :root { color-scheme: light dark; }
    .curve  { fill: none; stroke: #2563eb; stroke-width: 2.2; }
    .curve2 { fill: none; stroke: #0891b2; stroke-width: 2.2; }
    .fillA  { fill: #dbeafe; } .fillB { fill: #cffafe; }
    .tailA  { fill: #fca5a5; } .ghost { fill: #e5e7eb; }
